name: Publish weekly to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    # A commit made with GITHUB_TOKEN does not trigger another push workflow.
    workflows: ['Collect weekly games']
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: playtrace-github-pages
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          # Events can wait in the deployment queue. Always package current main.
          ref: refs/heads/main
          persist-credentials: false
      - name: Check static site
        run: |
          test -s dist/index.html
          test -s dist/library.js
          for archive in issues reference-2007-2016 reference-2017-2026 award-selections; do
            python3 -m json.tool "dist/data/$archive.json" > /dev/null
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
