name: Collect weekly games

on:
  schedule:
    # 01:07 UTC is 09:07 in Shanghai.
    - cron: '7 1 * * 1'
  workflow_dispatch:
    inputs:
      preview:
        description: Fetch live candidates without writing the issue
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: playtrace-weekly-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preview live candidates
        if: inputs.preview
        run: python scripts/collect.py --preview
      - name: Collect this week's issue
        if: ${{ !inputs.preview }}
        run: |
          python scripts/collect.py
          python tools/update_reader.py
      - name: Commit completed issue
        if: ${{ !inputs.preview }}
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git add -- README.md dist/data/issues.json
          if git diff --cached --quiet; then
            echo "The archive is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Collect weekly game selections"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
